version = 1
SPDX-PackageName = "zig-yaml"
SPDX-PackageSupplier = "Jeffrey C. Ollie <jeff@ocjtech.us>"
SPDX-PackageDownloadLocation = "https://git.jcollie.dev/jeff/zig-yaml"

# Files that cannot carry a header of their own: the lock file and the
# manifest are rewritten by tools, and build.zig.zon.nix is regenerated by
# zon2nix whenever a dependency moves.
[[annotations]]
path = ["flake.lock", "build.zig.zon", "build.zig.zon.nix"]
precedence = "aggregate"
