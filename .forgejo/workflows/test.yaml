name: test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: nixos-do-s
    enable-openid-connect: true
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check REUSE compliance
        run: nix develop -c reuse lint

      - name: Check Zig formatting compliance
        run: nix develop -c zig fmt --check .

      # The yaml-test-suite data comes through Nix, and so through the
      # cache, rather than being fetched by Zig.
      - name: Test
        run: nix develop -c zig build test --summary all --system "$(nix build --print-out-paths .#zig-deps)"

      # Nothing else builds the fuzz driver or the events tool, so without
      # this either could stop compiling and the test step would not notice.
      - name: Build everything that is not built by the steps above
        run: nix develop -c zig build check --system "$(nix build --print-out-paths .#zig-deps)"

      # Bounded by a count rather than a clock so that the run is the same on
      # every machine, and short because it is here to catch a property that
      # a change has made false rather than to search: a real campaign is
      # `zig build fuzz-run -- --seconds 600` on somebody's own machine.
      - name: Fuzz
        run: nix develop -c zig build fuzz-run --system "$(nix build --print-out-paths .#zig-deps)" -- --iterations 50000

      - name: Push to the cache
        if: ${{ !cancelled() && forge.ref == 'refs/heads/main' }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev

  # Published only from main, so that a branch build cannot replace the site
  # with a work in progress, and only after `test` has passed, so that it
  # cannot document a tree that does not compile.
  docs:
    needs: test
    if: ${{ forge.ref == 'refs/heads/main' }}
    runs-on: nixos-do-s
    enable-openid-connect: true
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API docs
        run: nix develop -c zig build docs --system "$(nix build --print-out-paths .#zig-deps)"

      - name: Publish docs
        run: >
          nix develop -c git-pages-cli https://jeff.jcollie.page/zig-yaml/
          --server jcollie.page
          --token ${{ forge.token }}
          --upload-dir zig-out/docs

      - name: Push to the cache
        if: ${{ !cancelled() }}
        uses: https://git.jcollie.dev/jeff/niks3-push@3f85f501658e379783381291241c6f8315a92716
        with:
          server-url: https://niks3.jcollie.dev
